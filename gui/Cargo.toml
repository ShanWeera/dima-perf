[package]
name = "dima-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
# Independent MSRV: NOT .workspace = true.
# egui/eframe/egui-wgpu 0.36.2 require Rust 1.95. The workspace MSRV stays at
# 1.81 for the CLI. Per-crate MSRV is a proven pattern (axum/tokio-rs PR #3633;
# Cargo Book "Multiple Policies in a Workspace"). With resolver 2, there are no
# MSRV-aware dependency resolution issues.
rust-version = "1.95"
authors = ["Shan Tharanga <stwm2@student.london.ac.uk>"]
description = "DiMA GUI - GPU-rendered desktop application for diversity motif analysis"

[[bin]]
name = "dima-gui"
path = "src/main.rs"

[dependencies]
dima_lib = { path = "..", package = "dima" }

# eframe defaults: wgpu (not glow), default_fonts, accesskit, x11, wayland.
# wgpu is the default renderer since 0.34 (#7615) — no need to disable defaults.
# We only add "persistence" (not a default) for window/app state save/restore,
# which also backs the persisted theme preference and panel sizes.
eframe = { version = "0.36.2", features = ["persistence"] }
egui = "0.36.2"
egui-wgpu = "0.36.2"
egui_extras = { version = "0.36.2", features = ["image"] }

# Direct dep for CallbackTrait types (Device, Queue, Buffer, etc.).
# MUST match the wgpu major that egui-wgpu links against, or the wgpu types in
# our render callback belong to a different crate instance and fail to unify:
# egui-wgpu 0.36.2 depends on wgpu ^30.0.
# Default features include the vulkan/metal/dx12 backends.
wgpu = "30"

# Native file dialogs (sync, no async runtime needed)
rfd = "0.17"

# Chart PNG export
image = { version = "0.25", default-features = false, features = ["png"] }

# Glyph rasterisation for PNG chart labels. The on-screen chart is drawn by
# egui, but a file export has no egui frame to draw into, so axis numbers and
# titles must be rasterised directly. Reuses the same bundled IBM Plex face as
# the UI, so exported figures match what the user sees.
ab_glyph = "0.2"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# GPU buffer data -- derive needed for #[derive(Pod, Zeroable)] on vertex structs
bytemuck = { version = "1", features = ["derive"] }

serde.workspace = true
serde_json.workspace = true

# Error type from dima_lib's write_results_to_output() return type
anyhow = "1"

# Platform-standard directories (~/.config, ~/Documents)
dirs = "6"

# ── Windows dependency-unification pin ──────────────────────────────────
# wgpu-hal 30 uses windows 0.62 for D3D12, but gpu-allocator 0.28 accepts
# windows >=0.53,<=0.62. Without this pin, Cargo's resolver may split
# gpu-allocator onto an older windows version (e.g. 0.61), producing
# incompatible D3D12 types and a build failure (E0277 / E0308) on Windows.
# Adding a direct dependency forces the resolver to unify on 0.62 for the
# entire crate graph. This is inert on non-Windows platforms.
# Still required after the wgpu 29 -> 30 upgrade (verified against
# wgpu-hal 30.0.1 and gpu-allocator 0.28.0 manifests).
# See: https://github.com/emilk/egui/issues/8069
[target.'cfg(windows)'.dependencies]
windows = "0.62"

[package.metadata.bundle]
name = "DiMA GUI"
identifier = "com.dima.gui"
icon = ["assets/icon.icns", "assets/icon.png"]
version = "0.1.0"
copyright = "Copyright (c) DiMA contributors"
osx_minimum_system_version = "11.0"
