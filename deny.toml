# cargo-deny policy (D95). https://embarkstudios.github.io/cargo-deny/
#
#   cargo deny check                       advisories, bans, licenses, sources (workspace)
#   cargo deny --config deny-strict.toml --exclude dima-gui --exclude xtask --exclude-dev check bans
#                                          no duplicate crate versions in the library and CLI
#
# CI runs both (advisories are non-blocking on pull requests, blocking on the default branch and weekly).

[graph]
# Every release target, so platform-only dependencies are checked on any host.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]
all-features = true

[advisories]
# Every ignore needs an id, a reason and a review date in the reason ("until YYYY-MM-DD").
ignore = [
    { id = "RUSTSEC-2026-0194", reason = "quick-xml is used only by the wayland-scanner proc-macro, which parses the Wayland protocol XML shipped in the wayland crates at compile time (trusted, fixed input); no runtime use; upstream pins quick-xml 0.39 (until 2027-04-05)" },
    { id = "RUSTSEC-2026-0195", reason = "same as RUSTSEC-2026-0194: compile-time parsing of trusted Wayland protocol files only (until 2027-04-05)" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is unmaintained but has no known vulnerability; the desktop app parses only its bundled fonts (ab_glyph, sctk-adwaita); no maintained replacement is used by egui yet (until 2027-04-05)" },
    { id = "RUSTSEC-2026-0441", reason = "pin-utils is unmaintained (archived) but has no known vulnerability; it reaches only the desktop app, through futures-util in its Linux accessibility stack (accesskit_unix), which has no release without it yet (until 2027-05-26)" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant is unmaintained as a standalone crate (merged into zbus 6) but has no known vulnerability; it reaches only the desktop app's Linux accessibility stack (accesskit_unix 0.21, atspi 0.29), which still uses zbus 5 (until 2027-05-26)" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: same as RUSTSEC-2026-0370 (until 2027-05-26)" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: same as RUSTSEC-2026-0370 (until 2027-05-26)" },
]

[licenses]
# Permissive licences only; anything else needs a deliberate decision.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    # bzip2's own licence (BSD-style), of the pure-Rust bzip2 decoder libbz2-rs-sys.
    "bzip2-1.0.6",
    # The fonts bundled by egui (epaint_default_fonts) for the desktop app.
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
confidence-threshold = 0.93

[bans]
# Workspace-wide duplicates are reported; the library and CLI deny them (deny-strict.toml).
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
skip = [
    { crate = "objc2@0.5.2", reason = "eframe 0.36 itself depends on both: accesskit_macos 0.26 on objc2 0.5 and arboard/rfd on 0.6; their types are never mixed (until the next egui upgrade)" },
]
# Two versions of these split GPU and windowing types and break the desktop build.
deny = [
    { crate = "windows", deny-multiple-versions = true, reason = "split D3D12 types break the Windows GUI build" },
    { crate = "wgpu", deny-multiple-versions = true, reason = "the GPU callback types must unify with egui-wgpu" },
    { crate = "raw-window-handle", deny-multiple-versions = true, reason = "window handles must unify across winit and wgpu" },
    { crate = "objc2", deny-multiple-versions = true, reason = "Objective-C runtime types must unify on macOS" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
