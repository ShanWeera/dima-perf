# pnpm settings of the documentation site (a single package).
packages:
  - "."

# Package scripts run in pnpm's built-in POSIX shell on every operating system, so that
# `VARIABLE=value command` in package.json also works on Windows.
shellEmulator: true

# The only dependency allowed to run an install script: esbuild (used by Vite and Astro) checks
# that its platform-specific binary is installed.
allowBuilds:
  esbuild: true
