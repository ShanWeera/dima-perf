# Documentation site (D102) on GitHub Pages:
#
#   https://shanweera.github.io/dima-perf/latest/      the master branch, rebuilt on every push
#   https://shanweera.github.io/dima-perf/vX.Y/        each release, unpacked from the docs archive
#                                                      attached to it (never rebuilt later)
#   https://shanweera.github.io/dima-perf/api/         rustdoc of the library and the CLI
#   https://shanweera.github.io/dima-perf/schemas/1.0/ the JSON Schemas (their $id URLs)
#   https://shanweera.github.io/dima-perf/versions.json  the version switcher's list
#
# Pull requests build the site; docs-preview.yml publishes that build to Cloudflare Pages.

name: Docs

on:
  push:
    branches: [master]
  pull_request:
  # Also dispatched by the release workflow after it publishes a release.
  workflow_dispatch:

permissions: {}

concurrency:
  group: docs-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: docs/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: docs/.node-version
          # No dependency cache: a poisoned cache must never reach a deployment or release.
          package-manager-cache: false
      - run: pnpm -C docs install --frozen-lockfile
      - name: Build the site
        shell: bash
        env:
          # A preview is served from the root of its own domain.
          DOCS_BASE: ${{ github.event_name == 'pull_request' && '/' || '/dima-perf/latest/' }}
        run: pnpm -C docs run build
      - name: Record the pull request number for the preview deployment
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: echo "$PR_NUMBER" > docs/dist/.pr-number
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ github.event_name == 'pull_request' && 'docs-preview' || 'site-latest' }}
          path: docs/dist/
          include-hidden-files: true

  api:
    name: API documentation (rustdoc)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - run: cargo doc --no-deps -p dima-core -p dima --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - shell: bash
        run: |
          cat > target/doc/index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>DiMA API</title>
          <meta http-equiv="refresh" content="0; url=dima_core/index.html">
          <a href="dima_core/index.html">dima_core</a>
          HTML
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api
          path: target/doc/

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: [build, api]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-latest
          path: site/latest
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: api
          path: site/api
      - name: Released versions, schemas and the version list
        shell: bash
        run: scripts/release/assemble-pages.sh site
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
