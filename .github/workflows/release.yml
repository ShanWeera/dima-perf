# Release (plan §15; D67, D79, D82, D91, D92, D95, D102).
#
# Started in either of two ways:
#   * from the Actions page: Release > Run workflow on the default branch, with the version
#     (X.Y.Z). The newest commit of that branch is released, and the tag vX.Y.Z is created on it
#     only after every build has passed, so a failed run leaves no tag behind;
#   * by pushing a tag vX.Y.Z.
# Either way the workflow checks that the version matches the workspace version, that
# CHANGELOG.md has a dated section for it and that no release for it exists yet, runs the full CI
# suite, builds every archive and package, smoke-tests the Linux builds on old and new
# distributions, then creates a *draft* release, uploads the assets with SHA256SUMS and
# build-provenance attestations, and publishes it (immutable releases: nothing is added after
# publication). No caches are used in release jobs.

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example 1.0.0 (the workspace version, with a dated CHANGELOG.md section)"
        required: true
        type: string
  # The CI gate (a reusable workflow) checks out the triggering commit: the tagged commit for a
  # tag push, the newest commit of the branch for a run started from the Actions page. A failed
  # release is re-run from the Actions page.
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions: {}

concurrency:
  group: release-${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # What every job checks out: the pushed tag, or the commit a run from the Actions page started
  # on (fixed for the whole run, even if the branch moves on).
  RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}
  # Release builds link the documentation of their own version (/vX.Y/) in --help, the app and
  # their messages (D113); other builds link /latest/.
  DIMA_RELEASE: "1"

jobs:
  version:
    name: Tag, version and changelog
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false
      - id: v
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
              echo "::error::start the release from the $DEFAULT_BRANCH branch (Run workflow > Use workflow from), not from $GITHUB_REF_NAME"
              exit 1
            fi
            version="${INPUT_VERSION#v}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$version' is not a version of the form X.Y.Z, for example 1.0.0"
            exit 1
          fi
          tag="v$version"
          workspace=$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version = "\(.*\)"/\1/p}' Cargo.toml)
          if [ "$version" != "$workspace" ]; then
            echo "::error::version $version does not match the workspace version $workspace"
            exit 1
          fi
          scripts/release/release-notes.sh "$version" > /dev/null
          # A run from the Actions page creates the tag on this commit later, so an existing tag
          # must already be on it; a pushed tag is the commit.
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            scripts/release/tag.sh check "$tag" "$GITHUB_SHA"
          else
            scripts/release/tag.sh check "$tag"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  ci:
    name: Full CI suite
    needs: version
    # The documented local-path form of a reusable workflow in the same repository.
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read

  man:
    name: Man pages
    needs: version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
      - run: cargo xtask man --out-dir man
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: man
          path: man/

  cli:
    name: CLI ${{ matrix.target }}
    needs: [version, ci, man]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc 2.17 floor: built inside manylinux2014 (D91).
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            container: quay.io/pypa/manylinux2014_x86_64
            glibc: "2.17"
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
            glibc: "2.28"
          # Static musl builds with mimalloc (D92).
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            musl: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            musl: true
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-pc-windows-msvc
            os: windows-2025
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-auditable@0.7.7,cargo-cyclonedx@0.5.9
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: man
          path: man
      - name: Install musl tools
        if: matrix.musl
        shell: bash
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
          # musl-tools ships only `musl-gcc`; on arm64 hosts cc-rs would look for
          # `aarch64-linux-musl-gcc` to build the C code of zstd-sys and libmimalloc-sys.
          echo "CC_${TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"
      - name: Build in a manylinux container (glibc ${{ matrix.glibc }})
        if: matrix.container
        shell: bash
        env:
          IMAGE: ${{ matrix.container }}
        run: |
          docker run --rm -v "$PWD:/io" -w /io -e TARGET -e CARGO_INCREMENTAL -e DIMA_RELEASE "$IMAGE" bash -euo pipefail -c '
            curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
            source "$HOME/.cargo/env"
            cargo install --locked cargo-auditable@0.7.7
            cargo auditable build --release --locked -p dima --target "$TARGET"
          '
          sudo chown -R "$(id -u):$(id -g)" target
      - name: Build
        if: ${{ !matrix.container }}
        shell: bash
        run: cargo auditable build --release --locked -p dima --target "$TARGET"
      - name: Check the glibc floor (D91)
        if: matrix.glibc
        shell: bash
        env:
          FLOOR: ${{ matrix.glibc }}
        run: |
          newest=$(objdump -T "target/$TARGET/release/dima" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -1)
          echo "newest glibc symbol: $newest (floor $FLOOR)"
          [ "$(printf '%s\n%s\n' "$newest" "$FLOOR" | sort -V | tail -1)" = "$FLOOR" ]
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          exe="target/$TARGET/release/dima"
          case "$TARGET" in *windows*) exe="$exe.exe"; man="" ;; *) man="man" ;; esac
          scripts/release/package-cli.sh "$TARGET" "$VERSION" "$exe" dist $man
      - name: SBOM (CycloneDX)
        shell: bash
        run: |
          name="dima-$VERSION-$TARGET.cdx"
          cargo cyclonedx --manifest-path crates/dima/Cargo.toml --format json --all \
            --target "$TARGET" --spec-version 1.5 --override-filename "$name"
          sbom=$(find crates/dima -maxdepth 1 -name "$name*.json" | head -1)
          test -n "$sbom"
          mv "$sbom" "dist/$name.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-${{ matrix.target }}
          path: dist/

  smoke:
    name: Smoke test ${{ matrix.image }}
    needs: [version, cli]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "centos:7", target: x86_64-unknown-linux-gnu }
          - { image: "rockylinux:8", target: x86_64-unknown-linux-gnu }
          - { image: "rockylinux:9", target: x86_64-unknown-linux-gnu }
          - { image: "ubuntu:20.04", target: x86_64-unknown-linux-gnu }
          - { image: "ubuntu:24.04", target: x86_64-unknown-linux-gnu }
          - { image: "debian:12", target: x86_64-unknown-linux-gnu }
          - { image: "alpine:3", target: x86_64-unknown-linux-musl }
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TARGET: ${{ matrix.target }}
      IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-${{ matrix.target }}
          path: dist
      # The paper's MERS dataset must give the committed golden tables byte for byte.
      - shell: bash
        run: |
          tar -xzf "dist/dima-$VERSION-$TARGET.tar.gz" -C dist
          docker run --rm -v "$PWD:/w" -w /w -e VERSION -e TARGET "$IMAGE" sh -euc '
            bin="dist/dima-$VERSION-$TARGET/dima"
            "$bin" --version
            "$bin" analyze -i samples/mers_spike_aa.fasta --tsv-dir /tmp/out -q
            # cksum is in every base image (coreutils, busybox); cmp/diffutils is not.
            for t in positions variants; do
              test "$(cksum < /tmp/out/mers_spike_aa.$t.tsv)" = \
                   "$(cksum < tests/golden/mers_spike_aa/tables/mers_spike_aa.$t.tsv)"
            done
            echo ok
          '

  allocator-benchmark:
    name: musl (mimalloc) vs glibc benchmark (D92)
    needs: [version, cli]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cli-x86_64-unknown-linux-*
          path: dist
          merge-multiple: true
      - shell: bash
        run: |
          for t in gnu musl; do tar -xzf "dist/dima-$VERSION-x86_64-unknown-linux-$t.tar.gz" -C dist; done
          bzip2 -dk tests/data/HIV1_FLT_2022_pol_DNA.fasta.bz2
          scripts/release/allocator-benchmark.sh \
            "dist/dima-$VERSION-x86_64-unknown-linux-gnu/dima" \
            "dist/dima-$VERSION-x86_64-unknown-linux-musl/dima" \
            tests/data/HIV1_FLT_2022_pol_DNA.fasta > allocator.md
          cat allocator.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: allocator-benchmark
          path: allocator.md

  gui:
    name: Desktop app ${{ matrix.name }}
    needs: [version, ci]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            os: macos-15
            kind: macos
          - name: Windows x86_64
            os: windows-2025
            kind: windows
            target: x86_64-pc-windows-msvc
            arch: x86_64
          - name: Windows ARM64
            os: windows-11-arm
            kind: windows
            target: aarch64-pc-windows-msvc
            arch: aarch64
          - name: Linux x86_64
            os: ubuntu-24.04
            kind: linux
            target: x86_64-unknown-linux-gnu
            arch: x86_64
            container: quay.io/pypa/manylinux_2_28_x86_64
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            kind: linux
            target: aarch64-unknown-linux-gnu
            arch: aarch64
            container: quay.io/pypa/manylinux_2_28_aarch64
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TARGET: ${{ matrix.target }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
          targets: ${{ matrix.kind == 'macos' && 'x86_64-apple-darwin,aarch64-apple-darwin' || matrix.target }}
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-packager@0.11.8,cargo-auditable@0.7.7
      - name: Build (macOS universal binary)
        if: matrix.kind == 'macos'
        shell: bash
        run: |
          for t in x86_64-apple-darwin aarch64-apple-darwin; do
            cargo auditable build --release --locked -p dima-gui --target "$t"
          done
          mkdir -p target/universal-apple-darwin/release
          lipo -create -output target/universal-apple-darwin/release/dima-gui \
            target/x86_64-apple-darwin/release/dima-gui target/aarch64-apple-darwin/release/dima-gui
          cargo packager -p dima-gui --release --formats app,dmg \
            --binaries-dir target/universal-apple-darwin/release --out-dir dist-raw
          mkdir -p dist
          mv dist-raw/*.dmg "dist/DiMA-$VERSION-universal.dmg"
      - name: Build (Windows)
        if: matrix.kind == 'windows'
        shell: bash
        run: |
          cargo auditable build --release --locked -p dima-gui --target "$TARGET"
          cargo packager -p dima-gui --release --formats wix --target "$TARGET" \
            --binaries-dir "target/$TARGET/release" --out-dir dist-raw
          mkdir -p dist
          mv dist-raw/*.msi "dist/DiMA-$VERSION-$ARCH.msi"
      - name: Build in a manylinux_2_28 container (glibc 2.28)
        if: matrix.kind == 'linux'
        shell: bash
        env:
          IMAGE: ${{ matrix.container }}
        run: |
          docker run --rm -v "$PWD:/io" -w /io -e TARGET -e CARGO_INCREMENTAL -e DIMA_RELEASE "$IMAGE" bash -euo pipefail -c '
            dnf install -y libxkbcommon-devel wayland-devel libX11-devel libXcursor-devel \
              libXrandr-devel libXi-devel mesa-libEGL-devel mesa-libGL-devel vulkan-loader-devel
            curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
            source "$HOME/.cargo/env"
            cargo install --locked cargo-auditable@0.7.7
            cargo auditable build --release --locked -p dima-gui --target "$TARGET"
          '
          sudo chown -R "$(id -u):$(id -g)" target
          newest=$(objdump -T "target/$TARGET/release/dima-gui" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -1)
          echo "newest glibc symbol: $newest (floor 2.28)"
          [ "$(printf '%s\n2.28\n' "$newest" | sort -V | tail -1)" = "2.28" ]
      - name: Package (Linux)
        if: matrix.kind == 'linux'
        shell: bash
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libfuse2t64
          cargo packager -p dima-gui --release --formats deb,appimage --target "$TARGET" \
            --binaries-dir "target/$TARGET/release" --out-dir dist-raw
          mkdir -p dist
          mv dist-raw/*.AppImage "dist/DiMA-$VERSION-$ARCH.AppImage"
          mv dist-raw/*.deb "dist/dima-gui_${VERSION}_${ARCH}.deb"
          # A plain archive for HPC login nodes without FUSE.
          stage="dima-gui-$VERSION-$ARCH-linux"
          mkdir -p "$stage"
          cp "target/$TARGET/release/dima-gui" README.md LICENSE THIRD-PARTY-NOTICES.md "$stage/"
          cp crates/dima-gui/assets/fonts/OFL.txt "$stage/"
          tar -czf "dist/$stage.tar.gz" "$stage"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gui-${{ matrix.kind }}-${{ matrix.arch || 'universal' }}
          path: dist/

  docs:
    name: Documentation for this version
    needs: [version, ci]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: docs/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: docs/.node-version
          # No dependency cache: a poisoned cache must never reach a deployment or release.
          package-manager-cache: false
      - run: pnpm -C docs install --frozen-lockfile
      # Each release's docs live at /dima-perf/vX.Y/ and are never rebuilt later (D102): the
      # Pages deployment unpacks this archive.
      - name: Build
        shell: bash
        run: |
          minor="${VERSION%.*}"
          DOCS_BASE="/dima-perf/v$minor/" pnpm -C docs run build
          mkdir -p dist
          tar -C docs/dist -czf "dist/dima-$VERSION-docs.tar.gz" .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs
          path: dist/

  publish:
    name: Publish the release
    needs: [version, cli, smoke, allocator-benchmark, gui, docs]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      # Events created with the workflow token do not start other workflows, so the docs
      # deployment (which adds /vX.Y/ from this release's docs archive) is dispatched here.
      actions: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - name: Collect assets and checksums
        shell: bash
        run: |
          mkdir -p assets
          find artifacts -type f ! -name 'allocator.md' ! -path 'artifacts/man/*' -exec cp {} assets/ \;
          (cd assets && sha256sum -- * > ../SHA256SUMS)
          mv SHA256SUMS assets/
          cat assets/SHA256SUMS
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        id: attest
        with:
          subject-checksums: assets/SHA256SUMS
      - name: Attach the attestation bundle
        shell: bash
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" "assets/dima-$VERSION.intoto.jsonl"
      # A run from the Actions page tags the commit it built only now, after every job passed. A
      # tag created with the workflow token starts no other workflow, so this stays the only run.
      - name: Create the tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: scripts/release/tag.sh create "$RELEASE_TAG" "$GITHUB_SHA"
      - name: Create a draft, upload, publish
        shell: bash
        run: |
          scripts/release/release-notes.sh "$VERSION" artifacts/allocator-benchmark/allocator.md > notes.md
          gh release create "$RELEASE_TAG" --draft --verify-tag --title "DiMA $VERSION" --notes-file notes.md
          gh release upload "$RELEASE_TAG" assets/*
          gh release edit "$RELEASE_TAG" --draft=false
          gh workflow run docs.yml --ref master
