# Continuous integration (plan §14; D25, D30, D66, D93–D96).
#
# Every action is pinned to a commit SHA (with its release in a comment); Dependabot keeps the
# pins current. Jobs get only the permissions they need; checkouts do not keep credentials.

name: CI

on:
  # Branches only: a release tag runs this suite through the release workflow instead.
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  # The release workflow runs this whole suite as its gate.
  workflow_call:
  schedule:
    # Weekly: catches new advisories, toolchain changes, dead links and citation drift.
    - cron: "17 4 * * 1"

permissions: {}

# github.workflow is "Release" when the release workflow runs this suite, so a release's CI gate
# never shares a group with (and is never cancelled by) this workflow's own runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy (workspace, all targets)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
          components: clippy
      - name: Install GUI system libraries
        run: ./scripts/ci/install-gui-deps.sh
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: clippy
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: test-${{ matrix.os }}
      # Golden files are compared byte for byte on every platform (D94).
      - run: cargo test -p dima-core -p dima -p xtask --locked
      # Test builds unify the features of dev-dependencies, so this checks the binary as
      # shipped: results read back give the exact numbers written (serde_json float_roundtrip).
      - name: Results read back byte for byte (shipped feature set)
        shell: bash
        run: |
          cargo build -p dima --locked
          target/debug/dima analyze -i samples/mers_spike_aa.fasta -q -o "$RUNNER_TEMP/r.json"
          target/debug/dima view -i "$RUNNER_TEMP/r.json" -q -o "$RUNNER_TEMP/back.json"
          cmp "$RUNNER_TEMP/r.json" "$RUNNER_TEMP/back.json"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: runner.os == 'Windows'
        with:
          python-version: "3.12"
      # .cargo/config.toml links the C runtime statically on Windows: the program must not need
      # the Visual C++ Redistributable (a RUSTFLAGS variable would silently drop the setting).
      - name: The C runtime is linked statically (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: python scripts/release/check-windows-crt.py --machine x86_64 target/debug/dima.exe
      - name: gzip decoding uses zlib-rs with SIMD detection (D93)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo tree -p dima-core -e features -i zlib-rs --locked | tee tree.txt
          grep -q 'zlib-rs feature "std"' tree.txt

  signals-pid1:
    name: Signals as PID 1 (PID namespace)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: pid1
      - run: cargo build -p dima --locked
      # As PID 1 (a container's entry point) the kernel ignores a re-raised default-action
      # signal, so dima must exit with 128 + n itself, never abort (D96).
      - run: ./scripts/ci/pid1-signal-test.sh target/debug/dima

  gui:
    name: GUI tests (Linux)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
      - name: Install GUI system libraries (with the llvmpipe software renderer)
        run: ./scripts/ci/install-gui-deps.sh
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: gui
      - run: cargo test -p dima-gui --locked

  gui-build:
    name: GUI build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: gui-build-${{ matrix.os }}
      - run: cargo check -p dima-gui --all-targets --locked

  msrv:
    name: MSRV (${{ matrix.toolchain }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Library and CLI (D30): tests too, so the MSRV claim is real.
          - toolchain: "1.85"
            command: cargo test -p dima-core -p dima --all-targets --locked
          # Desktop app.
          - toolchain: "1.95"
            command: cargo check -p dima-gui --all-targets --locked
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: Install GUI system libraries
        if: matrix.toolchain == '1.95'
        run: ./scripts/ci/install-gui-deps.sh
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: msrv-${{ matrix.toolchain }}
      # rust-toolchain.toml selects stable; the environment variable overrides it.
      - run: ${{ matrix.command }}
        env:
          RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}

  deny:
    name: Dependencies (cargo-deny)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - checks: bans licenses sources
            arguments: --all-features
          # No duplicate crate versions in what the library and CLI ship (D95).
          - checks: bans
            arguments: --config deny-strict.toml --exclude dima-gui --exclude xtask --exclude-dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check ${{ matrix.checks }}
          arguments: ${{ matrix.arguments }}
          manifest-path: ./Cargo.toml

  advisories:
    name: Security advisories (non-blocking on pull requests)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories

  generated:
    name: Generated files, citation metadata and reference implementation
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: generated
      # CLI reference, bibliography, references.json/.bib, CITATION.cff, .zenodo.json, Crossref
      # snapshot, schema versions and CHANGELOG section (D68, D89, D94, D111).
      - run: cargo xtask gen --mode check
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate CITATION.cff (D69)
        run: |
          python -m pip install --disable-pip-version-check cffconvert==2.0.0
          cffconvert --validate
      - name: Independent Python reference implementation self-test
        run: python scripts/reference/dima_reference.py --self-test
      - name: Windows C runtime checker self-test
        run: python scripts/release/check-windows-crt.py --self-test
      # About a minute: the reference implementation on the bundled datasets and the ToBRFV samples.
      - name: The paper test's expected values match the reference implementation
        run: python scripts/reference/paper_values.py --check
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-about@0.9.2
      - name: THIRD-PARTY-NOTICES.md matches the dependency tree (D95)
        run: python scripts/notices/generate.py --check
      - name: API documentation builds without warnings
        run: cargo doc --no-deps -p dima-core -p dima --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Benchmarks compile
        run: cargo bench --no-run -p dima-core --locked

  docs:
    name: Documentation site
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: docs/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: docs/.node-version
          # No dependency cache: a poisoned cache must never reach a deployment or release.
          package-manager-cache: false
      - run: pnpm -C docs install --frozen-lockfile
      # Type and content checks, then the build (with internal link validation), then an
      # accessibility scan (WCAG 2.2 AA) and a Lighthouse budget on the built site (D102).
      - run: pnpm -C docs run check
      - run: pnpm -C docs run build
      - run: pnpm -C docs run test:a11y
      - run: pnpm -C docs run test:lighthouse

  coverage:
    name: Coverage (informational)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-llvm-cov@0.9.1
      - run: cargo llvm-cov -p dima-core -p dima --locked --summary-only

  workflows:
    name: Workflow security lint (zizmor)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false

  links:
    name: External links and DOIs (weekly, non-blocking)
    # Not when the release workflow runs this suite: the github context, and so github.workflow,
    # is the caller's there ("Release"), while this workflow's own runs carry its `name:` (CI).
    if: github.workflow == 'CI' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # External links only: links within the site (written as site paths such as
      # /reference/cli/, which lychee cannot resolve in the sources) are checked by the docs
      # build (starlight-links-validator and the content guard).
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress --max-concurrency 4 --scheme https --scheme http --user-agent "dima-link-check/1.0" "README.md" "CHANGELOG.md" "docs/src/**/*.md" "docs/src/**/*.mdx"
          fail: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Re-fetches every DOI from Crossref and reports drift from the stored snapshot.
      - run: python scripts/citations/crossref.py
