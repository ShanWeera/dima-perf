name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Rust checks (CLI + library only — GUI checks are in the gui job below)
  rust:
    name: Rust (${{ matrix.check }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [test, clippy, fmt]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: cargo test
        if: matrix.check == 'test'
        run: cargo test -p dima --locked

      - name: cargo clippy
        if: matrix.check == 'clippy'
        run: cargo clippy -p dima --locked -- -D warnings

      - name: cargo fmt
        if: matrix.check == 'fmt'
        run: cargo fmt --all -- --check

  # GUI checks (clippy, test, MSRV for dima-gui crate)
  gui:
    name: GUI (${{ matrix.check }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [clippy, test]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # egui/eframe/wgpu on Linux requires system libs for X11/Wayland/EGL
      - name: Install system dependencies (egui/wgpu)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxrandr-dev libxi-dev libxtst-dev libx11-dev \
            libgl-dev libegl-dev libvulkan-dev

      - uses: Swatinem/rust-cache@v2

      - name: cargo clippy (dima-gui)
        if: matrix.check == 'clippy'
        run: cargo clippy -p dima-gui --locked -- -D warnings

      - name: cargo test (dima-gui)
        if: matrix.check == 'test'
        run: cargo test -p dima-gui --locked

  # GUI MSRV check — ensures dima-gui's rust-version = "1.92" is buildable
  gui-msrv:
    name: GUI MSRV (1.92)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92"

      - name: Install system dependencies (egui/wgpu)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxrandr-dev libxi-dev libxtst-dev libx11-dev \
            libgl-dev libegl-dev libvulkan-dev

      - uses: Swatinem/rust-cache@v2

      - name: Check MSRV compiles
        run: cargo check -p dima-gui --locked

  # CLI-only checks (benchmarks compile, MSRV, macOS)
  cli:
    name: CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run CLI tests
        run: cargo test -p dima --locked

      - name: Compile benchmarks (regression check)
        run: cargo bench --no-run --locked -p dima

  # MSRV check — ensures declared rust-version is actually buildable
  msrv:
    name: MSRV (1.81)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.81"

      - uses: Swatinem/rust-cache@v2

      - name: Check MSRV compiles
        run: cargo check -p dima --locked

