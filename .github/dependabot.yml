# Dependency updates (D95, D102): grouped, with a cooldown so new releases have time to be
# yanked or patched before they reach this repository.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      rust-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      astro:
        patterns: ["astro", "@astrojs/*", "starlight*", "@astrojs/starlight*"]
      docs-tooling:
        patterns: ["*"]
