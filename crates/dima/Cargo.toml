[package]
name = "dima"
description = "DiMA command-line interface: sequence diversity dynamics analyser for viruses"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
readme = "../../README.md"

[lib]
path = "src/lib.rs"

[[bin]]
name = "dima"
path = "src/main.rs"
# The library documents the CLI; the binary has nothing more to document.
doc = false

[dependencies]
dima-core.workspace = true
serde.workspace = true
serde_json.workspace = true
clap = { version = "4.5", features = ["derive", "wrap_help", "env"] }
clap_complete = "4.5"
colorchoice-clap = "1.0"
anstream = "1.0"
anstyle = "1.0"
terminal_size = "0.4"
tracing = { version = "0.1.41", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["env-filter", "fmt", "std", "ansi"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

# musl's allocator is slow under threads (D92): use mimalloc there only.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1.52", default-features = false, features = ["v2"] }

[dev-dependencies]
tempfile = "3.20"
jsonschema = { version = "0.58.5", default-features = false }
