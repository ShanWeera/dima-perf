# cargo-about configuration for THIRD-PARTY-NOTICES.md (D95), generated by
# `python3 scripts/notices/generate.py` for the shipped binaries (dima, dima-gui).
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "bzip2-1.0.6",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
ignore-dev-dependencies = true
ignore-build-dependencies = false
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]

# zstd-sys compiles the Zstandard C library it bundles into the binaries: that code is under
# zstd's BSD-3-Clause licence (Meta Platforms), the crate's own Rust code under MIT OR
# Apache-2.0, and its generated bindings under BSD-3-Clause (Facebook). The checksums pin the
# reviewed texts; a new zstd-sys release that changes them fails the notices check.
[zstd-sys.clarify]
license = "(MIT OR Apache-2.0) AND BSD-3-Clause"

[[zstd-sys.clarify.files]]
path = "LICENSE.Mit"
license = "MIT"
checksum = "129e8edef29e9abcd2ebabe252f4ef1b1289cdca356bf0040284a2fbccfb96c8"

[[zstd-sys.clarify.files]]
path = "zstd/LICENSE"
license = "BSD-3-Clause"
checksum = "7055266497633c9025b777c78eb7235af13922117480ed5c674677adc381c9d8"

[[zstd-sys.clarify.files]]
path = "LICENSE.BSD-3-Clause"
license = "BSD-3-Clause"
checksum = "48341f685c87304089aa099b23c386f8bacc519ef555aa7a13e239908907b3fd"
