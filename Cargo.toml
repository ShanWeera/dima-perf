[workspace]
members = [
    "crates/dima-core",
    "crates/dima",
    "crates/dima-gui",
    "xtask",
]
# A bare `cargo build/test` covers the library and the CLI; the GUI needs a
# newer toolchain (MSRV 1.95) and system graphics libraries, so it is opted into
# explicitly (`-p dima-gui` or `--workspace`).
default-members = ["crates/dima-core", "crates/dima"]
# Resolver 3: MSRV-aware dependency resolution (Cargo >= 1.84).
resolver = "3"

[workspace.package]
version = "1.1.1"
edition = "2024"
license = "MIT"
rust-version = "1.85"
authors = ["Shan Tharanga <stwm2@student.london.ac.uk>"]
repository = "https://github.com/ShanWeera/dima-perf"
homepage = "https://shanweera.github.io/dima-perf/"
publish = false

[workspace.dependencies]
dima-core = { path = "crates/dima-core" }
serde = { version = "1.0", features = ["derive"] }
# float_roundtrip: numbers read back from results files are the exact values written
# (`dima view`, `dima hcs` and the desktop app re-write them byte for byte).
serde_json = { version = "1.0", features = ["float_roundtrip"] }
rayon = "1.10"
thiserror = "2.0"
libm = "0.2.15"

[profile.release]
lto = true
codegen-units = 1
strip = true
# Unwind (plan D62): panics are caught at the CLI/GUI boundaries so temporary
# outputs are cleaned up and the user gets an actionable report.
panic = "unwind"

# The analysis engine is compute-bound; keep debug builds and tests usable.
[profile.dev.package.dima-core]
opt-level = 2
