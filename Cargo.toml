[workspace]
members = [".", "gui"]
default-members = ["."]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.81"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"

[package]
name = "dima"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors = ["Shan Tharanga <stwm2@student.london.ac.uk>"]
description = "DiMA - Diversity Motif Analyser: A native Rust library for analyzing k-mer diversity in FASTA sequences"

[lib]
name = "dima_lib"
path = "src/lib.rs"

[[bin]]
name = "dima"
path = "src/main.rs"

[dependencies]
needletail = "0.7"
rand.workspace = true
rayon = "1.7"
serde.workspace = true
serde_json.workspace = true
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4"
hashbrown = { version = "0.14", features = ["serde"] }
indicatif = "0.18"
memmap2 = "0.9.11"
wide = { version = "0.7", features = ["std"] }
libm = "0.2"
bincode = "1.3"
lz4_flex = "0.11.6"
zstd = "0.13"
flate2 = "1"
bzip2 = "0.6"
liblzma = "0.3"
bytemuck = { version = "1", features = ["derive"] }
csv = "1.3"
ctrlc = "3.4"
libc = "0.2"
crc32fast = "1.5.0"
thiserror = "2"
anyhow = "1"
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-indicatif = "0.3"
clap-verbosity-flag = { version = "3", default-features = false, features = ["tracing"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }
insta = { version = "1", features = ["json", "redactions"] }

[[bench]]
name = "entropy"
harness = false

[[bench]]
name = "kmer"
harness = false

# Optimized release profile — used by `cargo build --release`
[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Optimize the analysis engine in debug builds.
#
# `dima` is compute-bound (Shannon entropy with resampling, k-mer encoding,
# SIMD string ops, rayon fan-out). At opt-level 0 a real alignment takes orders
# of magnitude longer than in release — long enough that a debug `cargo run -p
# dima-gui` looks like a hung application rather than a slow one.
#
# Only this package is lifted: dima-gui's own UI code stays at opt-level 0 and
# remains fully debuggable, and the release profile is untouched. The cost is a
# slightly slower first compile of the library.
[profile.dev.package.dima]
opt-level = 2

# Optimize GPU/UI libraries in debug mode for tolerable egui performance.
# Only these packages are optimized; dima-gui's own app code stays at
# opt-level 0 for fast compilation and debuggability.
[profile.dev.package.egui]
opt-level = 2
[profile.dev.package.eframe]
opt-level = 2
[profile.dev.package.egui-wgpu]
opt-level = 2
[profile.dev.package.egui_extras]
opt-level = 2
[profile.dev.package.wgpu]
opt-level = 2
